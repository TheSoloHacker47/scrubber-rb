name: Release

# Cross-compiles a platform gem for every mainstream target, then publishes all
# of them to RubyGems via Trusted Publishing (OIDC — no API key stored here).
#
# Triggered by pushing a version tag:
#
#     git tag -a v0.1.0 -m "scrubber_rb 0.1.0" && git push origin v0.1.0
#
# Run it with workflow_dispatch and dry_run first if you want to see the gems
# built without publishing them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the gems but do not publish"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Never publish a tag that does not pass its own test suite.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --features link-ruby -- -D warnings
      - run: cargo test --features link-ruby
      - run: bundle exec rake compile
      - run: bundle exec rake spec
      - run: bundle exec rubocop --parallel

      - name: Tag must match Scrubber::VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(ruby -Ilib -e 'require "scrubber/version"; print Scrubber::VERSION')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Scrubber::VERSION $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Scrubber::VERSION $version"

  # TEMPORARY probe: ask the build image which cross-rubies it actually has,
  # instead of guessing version strings one CI run at a time. Delete once the
  # version list in cross-gem is settled.
  probe:
    name: Probe cross-ruby inventory
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install rb_sys --no-document
      - name: What does the image contain?
        run: |
          rb-sys-dock --platform x86_64-linux --directory . -- '
            echo "=== rake-compiler dirs ===";
            ls -1 /usr/local/rake-compiler/ruby/ 2>/dev/null || true;
            for d in /usr/local/rake-compiler/ruby/*/; do echo "[$d]"; ls -1 "$d"; done 2>/dev/null || true;
            echo "=== config.yml keys ===";
            cat /usr/local/rake-compiler/config.yml 2>/dev/null | head -40;
            cat ~/.rake-compiler/config.yml 2>/dev/null | head -40;
            echo "=== HOME ==="; echo "$HOME"; ls -la "$HOME" | head -20
          ' || true

  cross-gem:
    name: ${{ matrix.platform }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
          - x86_64-linux-musl
          - aarch64-linux
          - aarch64-linux-musl
          - x86_64-darwin
          - arm64-darwin
        include:
          # Best-effort, explicitly not a release blocker.
          - platform: x64-mingw-ucrt
            optional: true
    continue-on-error: ${{ matrix.optional || false }}
    steps:
      - uses: actions/checkout@v4

      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cargo-cache: true
          cache-version: v1

      # This list needs both forms on purpose.
      #
      # Omitting it entirely is not an option: the image's own default includes
      # Ruby 2.6 and 2.7, which this crate cannot build against, and the job
      # dies there. But naming a bare "3.4" is not enough either — rb-sys-dock
      # expands that to "3.4.0", the image has no cross-ruby by that name, and
      # rake-compiler logs one line, skips the ABI and still exits 0. That
      # shipped gems with .so files for 3.1/3.2/3.3 only, which would have
      # raised LoadError on every Ruby 3.4 install.
      #
      # The older ABIs are present under X.Y.0 names and 3.4 under its real
      # patch version, so both spellings are listed; rake-compiler builds
      # whichever exist and ignores the rest. The check below is what actually
      # guarantees the result, so if the image's naming changes again this
      # fails loudly instead of shipping a gem with a hole in it.
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.1,3.2,3.3,3.4,3.4.9"

      # Upload before verifying, so that a gem which fails the check below is
      # still downloadable and can be inspected instead of rebuilt.
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

      # ...and verify it, because the failure mode above was silent.
      - name: Every supported ABI must be in the gem
        shell: bash
        run: |
          set -euo pipefail
          gem_path="${{ steps.cross-gem.outputs.gem-path }}"
          echo "inspecting $gem_path"
          abis="$(tar -xOf "$gem_path" data.tar.gz | tar -tzf - \
                  | grep -E '^lib/scrubber_rb/[0-9]+\.[0-9]+/.*\.(so|bundle|dll)$' \
                  | cut -d/ -f3 | sort -u || true)"
          echo "ABIs present: $(echo "$abis" | tr '\n' ' ')"
          missing=""
          for want in 3.1 3.2 3.3 3.4; do
            grep -qx "$want" <<< "$abis" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "::error::$gem_path is missing native libraries for:$missing"
            exit 1
          fi

  source-gem:
    name: source (ruby platform)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: dtolnay/rust-toolchain@stable

      # The fallback for platforms with no prebuilt gem. It must still install
      # and work, so build it and prove it.
      - run: bundle exec rake build
      - name: Install and smoke-test
        run: |
          gem install pkg/scrubber_rb-*.gem
          cd /tmp
          ruby -e 'require "scrubber_rb"; abort unless Scrubber.scrub("a@b.com") == "[EMAIL]"; puts "ok"'

      - uses: actions/upload-artifact@v4
        with:
          name: gem-ruby
          path: pkg/*.gem
          if-no-files-found: error

  publish:
    name: Publish to RubyGems
    needs: [cross-gem, source-gem]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    environment:
      name: release
      url: https://rubygems.org/gems/scrubber_rb
    permissions:
      contents: write
      # Required for Trusted Publishing: this is what mints the short-lived
      # OIDC token RubyGems exchanges for a scoped API key.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/download-artifact@v4
        with:
          path: pkg
          pattern: gem-*
          merge-multiple: true

      - name: List what is about to be published
        run: ls -lh pkg/

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Push every gem
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            echo "==> pushing $(basename "$gem")"
            gem push "$gem"
          done

      - name: Wait for RubyGems to index the release
        run: |
          version="$(ruby -Ilib -e 'require "scrubber/version"; print Scrubber::VERSION')"
          bundle exec ruby -e '
            require "net/http"
            require "json"
            version = ARGV[0]
            40.times do
              body = Net::HTTP.get(URI("https://rubygems.org/api/v1/versions/scrubber_rb.json")) rescue nil
              if body && JSON.parse(body).any? { |v| v["number"] == version }
                puts "indexed #{version}"
                exit 0
              end
              sleep 15
            end
            warn "timed out waiting for #{version} to be indexed (it may still land)"
          ' "$version"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" pkg/*.gem \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
